<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e8a4c">
  <title>Solitari de Famílies</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== PANTALLA D'INICI ===== -->
  <div id="pantalla-inici" class="pantalla">
    <div class="logo">
      <div class="logo-corona">👑</div>
      <h1>Solitari<br><span>de Famílies</span></h1>
    </div>
    <p class="subtitol">Agrupa les paraules de cada família!</p>
    <div id="graella-nivells"></div>
    <button id="btn-admin" class="btn-text">🔧 Mode admin</button>
    <button id="btn-esborrar-progres" class="btn-text">Esborrar progrés</button>
  </div>

  <!-- ===== PANTALLA DE JOC ===== -->
  <div id="pantalla-joc" class="pantalla amagada">
    <header id="capçalera">
      <button id="btn-inici" class="btn-icona" title="Inici">🏠</button>
      <div id="info-nivell">
        <div id="nom-nivell"></div>
        <div id="comptador-moviments"></div>
      </div>
      <div class="botons-dreta">
        <button id="btn-desfer" class="btn-icona" title="Desfer">↩️</button>
        <button id="btn-reiniciar" class="btn-icona" title="Reiniciar">🔄</button>
      </div>
    </header>

    <div id="zona-robar">
      <div id="descart"></div>
      <div id="pila-robar"></div>
    </div>
    <div id="fundacions"></div>
    <div id="tauler"></div>

    <div id="missatge-flotant" class="amagada"></div>
  </div>

  <!-- ===== MODAL VICTÒRIA / DERROTA ===== -->
  <div id="modal" class="amagada">
    <div id="modal-caixa">
      <div id="modal-emoji"></div>
      <h2 id="modal-titol"></h2>
      <p id="modal-text"></p>
      <div id="modal-botons"></div>
    </div>
  </div>

  <script src="families.js"></script>
  <script src="dibuixos.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
